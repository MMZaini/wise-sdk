name: React preview

on:
  push:
    branches: [main]
    paths:
      - 'packages/react/**'
      - '.github/workflows/react-preview.yml'
  pull_request:
    paths:
      - 'packages/react/**'
      - '.github/workflows/react-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/react/package-lock.json
      - run: npm --prefix packages/react ci
      - run: npm --prefix packages/react test
      - working-directory: packages/react
        run: npx playwright install --with-deps chromium
      # Browser tests build and exercise the same static output that is deployed.
      - run: npm --prefix packages/react run test:browser
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/react/example/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the component preview
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
